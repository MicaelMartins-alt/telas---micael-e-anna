<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomMatch - Imobiliárias</title>
  
  <!-- Fontes e Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Seu Arquivo CSS Externo -->
  <link rel="stylesheet" href="Imobiliarias.css">
</head>
<body>

  <!-- CONTAINER PRINCIPAL DA PÁGINA -->
  <div class="page-container">

    <!-- CABEÇALHO -->
    <header class="navbar">
      <div class="logo">
        <a href="Home.html">
          <!-- COLOQUE A SUA LOGO PRINCIPAL AQUI -->
          <img src="sua-logotipo.png" alt="ROOMMATCH Logo" class="brand-logo-img">
        </a>
      </div>

      <!-- TOGGLE DE NAVEGAÇÃO CENTRAL -->
      <nav class="nav-toggle">
        <a href="Home.html" class="toggle-btn">Home</a>
        <a href="Imobiliarias.html" class="toggle-btn active">Imobiliárias</a>
      </nav>

      <div class="user-avatar" title="Perfil">
        <i class="fa-solid fa-user"></i>
      </div>
    </header>

    <hr class="header-divider">

    <!-- TÍTULO PRINCIPAL -->
    <section class="headline-section">
      <h1 class="headline-title">
        SUA BUSCA PELO IMÓVEL IDEAL COMEÇA<br>
        ESCOLHENDO QUEM MELHOR TE ENTENDE!
      </h1>
    </section>

    <!-- GRID DE IMOBILIÁRIAS -->
    <main class="realty-grid">

      <!-- CARD 1: FRANCIOSI IMÓVEIS (AZUL PASTEL) -->
      <article class="realty-card card-blue">
        <div class="card-image-wrapper">
          <img src="sua-imagem-franciosi.jpg" alt="Franciosi Imóveis" class="card-cover-img">
        </div>
        
        <!-- BALÃO COM IMAGEM OU TEXTO DO NOME DA EMPRESA -->
        <div class="logo-pill pill-blue">
          <!-- Opcional: Imagem da Logo -->
          <img alt="Franciosi Imóveis Logo" class="agency-logo-img">
          
          <!-- Nome Escrito em Texto (pode usar junto ou no lugar da imagem) -->
          <span class="agency-name text-franciosi">Franciosi <small>IMÓVEIS</small></span>
        </div>

        <div class="card-footer">
          <a href="#" class="saiba-mais-btn">Saiba mais...</a>
        </div>
      </article>

      <!-- CARD 2: RE/MAX (BEGE / AMARELO PASTEL) -->
      <article class="realty-card card-yellow">
        <div class="card-image-wrapper">
          <img src="sua-imagem-remax.jpg" alt="RE/MAX" class="card-cover-img">
        </div>

        <!-- BALÃO COM IMAGEM OU TEXTO DO NOME DA EMPRESA -->
        <div class="logo-pill pill-yellow">
          <!-- Opcional: Imagem da Logo -->
          <img alt="RE/MAX Logo" class="agency-logo-img">
          
          <!-- Nome Escrito em Texto -->
          <span class="agency-name text-remax">RE/MAX</span>
        </div>

        <div class="card-footer">
          <a href="#" class="saiba-mais-btn">Saiba mais...</a>
        </div>
      </article>

      <!-- CARD 3: CBRE (VERDE PASTEL) -->
      <article class="realty-card card-green">
        <div class="card-image-wrapper">
          <img alt="CBRE">
        </div>

        <!-- BALÃO COM IMAGEM OU TEXTO DO NOME DA EMPRESA -->
        <div class="logo-pill pill-green">
          <!-- Opcional: Imagem da Logo -->
          <img src="logo-cbre.png" alt="CBRE Logo" class="agency-logo-img">
          
          <!-- Nome Escrito em Texto -->
          <span class="agency-name text-cbre">CBRE</span>
        </div>

        <div class="card-footer">
          <a href="#" class="saiba-mais-btn">Saiba mais...</a>
        </div>
      </article>

    </main>

  </div>

</body>
</html>
