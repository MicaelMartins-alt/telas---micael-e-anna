<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomMatch - Imobiliárias</title>
  
  <!-- Fontes & Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Estilo Externo de Imobiliárias -->
  <link rel="stylesheet" href="Imobiliarias.css">
</head>
<body>

  <!-- CONTAINER PRINCIPAL -->
  <div class="page-container">

    <!-- CABEÇALHO -->
    <header class="navbar">
      <div class="logo">
        <a href="Home.html">
          <img src="sua-logotipo.png" alt="ROOMMATCH Logo" class="brand-logo-img">
        </a>
      </div>

      <!-- TOGGLE DE NAVEGAÇÃO COM LINKS ATIVOS -->
      <nav class="nav-toggle">
        <a href="Home.html" class="toggle-btn">Home</a>
        <a href="Imobiliarias.html" class="toggle-btn active">Imobiliárias</a>
      </nav>

      <div class="user-avatar" title="Perfil">
        <i class="fa-solid fa-user"></i>
      </div>
    </header>

    <hr class="header-divider">

    <!-- TÍTULO PRINCIPAL -->
    <section class="headline-section">
      <span class="headline-badge">Parceiros Oficiais</span>
      <h1 class="headline-title">
        Sua busca pelo imóvel ideal começa<br>
        escolhendo quem melhor te entende!
      </h1>
    </section>

    <!-- GRID DE IMOBILIÁRIAS -->
    <main class="realty-grid">

      <!-- CARD 1: FRANCIOSI -->
      <article class="realty-card card-blue">
        <div class="card-image-wrapper">
          <img src="Franciosi.png" alt="Franciosi Imóveis" class="card-cover-img">
          <div class="card-image-overlay"></div>
        </div>
        
        <div class="logo-pill pill-blue">
          <span class="agency-name text-franciosi">Franciosi <small>IMÓVEIS</small></span>
        </div>

        <div class="card-footer">
          <a href="#" class="saiba-mais-btn">
            Saiba mais 
            <i class="fa-solid fa-arrow-right-long icon-arrow"></i>
          </a>
        </div>
      </article>

      <!-- CARD 2: RE/MAX -->
      <article class="realty-card card-yellow">
        <div class="card-image-wrapper">
          <img src="sua-imagem-remax.jpg" alt="RE/MAX" class="card-cover-img">
          <div class="card-image-overlay"></div>
        </div>

        <div class="logo-pill pill-yellow">
          <span class="agency-name text-remax">RE/MAX</span>
        </div>

        <div class="card-footer">
          <a href="#" class="saiba-mais-btn">
            Saiba mais 
            <i class="fa-solid fa-arrow-right-long icon-arrow"></i>
          </a>
        </div>
      </article>

      <!-- CARD 3: CBRE -->
      <article class="realty-card card-green">
        <div class="card-image-wrapper">
          <img src="sua-imagem-cbre.jpg" alt="CBRE" class="card-cover-img">
          <div class="card-image-overlay"></div>
        </div>

        <div class="logo-pill pill-green">
          <span class="agency-name text-cbre">CBRE</span>
        </div>

        <div class="card-footer">
          <a href="#" class="saiba-mais-btn">
            Saiba mais 
            <i class="fa-solid fa-arrow-right-long icon-arrow"></i>
          </a>
        </div>
      </article>

    </main>

  </div>

</body>
</html>
