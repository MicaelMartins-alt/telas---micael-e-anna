<body>

  <!-- CONTAINER CENTRALIZADOR DA PÁGINA -->

          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>

    <!-- ÁREA PRINCIPAL (MAPA EM TEMPO REAL + CARDS) -->

      <!-- CONTAINER DO MAPA DO GOOGLE MAPS EM TEMPO REAL -->

          width="100%" 
          height="100%" 
          style="border:0;" 
          allowfullscreen="" 
          loading="lazy" 
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>

                Sorocaba, São Paulo

              <div class="card-footer">
                <div class="sub-logo">
                  <img src="Franciosi-circle-Icon.jpeg" alt="Logo" class="logo-img">

            <div class="card-badge">
              <button class="heart-icon" aria-label="Favoritar"><i class="fa-regular fa-heart"></i></button>

            </div>
            
            <div class="glass-overlay">
              <div class="location-title">

              <div class="card-footer">
                <div class="sub-logo">

              </div>
            </div>
          </div>
        </article>

        <!-- CARD 4 -->
        <article class="card">
          <div class="card-image-container">
            <img class="card-img" src="Casa-case4.jpg" alt="São Paulo, São Paulo">

            <div class="card-badge">

  <!-- SCRIPT INTERATIVO PARA OS BOTÕES DA TELA -->
  <script>
    // 1. Alternar abas ativas
    const toggleBtns = document.querySelectorAll('.toggle-btn');
    toggleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        toggleBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    // 2. Ação de Favoritar (Coração vermelho ao clicar)
    const heartButtons = document.querySelectorAll('.heart-icon');
    heartButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('active');
        const icon = btn.querySelector('i');
        if (btn.classList.contains('active')) {
          icon.classList.remove('fa-regular');
          icon.classList.add('fa-solid');
        } else {
          icon.classList.remove('fa-solid');
          icon.classList.add('fa-regular');
        }
      });
    });
  </script>
</body>
</html>
